schema = "animus.plugin.v1"
name = "animus-log-storage-s3"
version = "0.1.0"
plugin_kind = "log_storage_backend"
description = "S3-compatible log storage backend for Animus — durable, offloaded agent run logs on any S3 API (Railway, MinIO, R2, AWS S3)"

[capabilities]
streaming = true
progress = false
cancellation = true
methods = [
  "log_storage/store",
  "log_storage/query",
  "log_storage/tail",
  "log_storage/schema",
  "health/check",
]

[binary]
default = "animus-log-storage-s3"

[[env]]
key = "S3_BUCKET"
description = "Target S3 bucket name"
required = true
sensitive = false

[[env]]
key = "S3_ACCESS_KEY_ID"
description = "S3 access key id"
required = true
sensitive = true

[[env]]
key = "S3_SECRET_ACCESS_KEY"
description = "S3 secret access key"
required = true
sensitive = true

[[env]]
key = "S3_ENDPOINT"
description = "Custom S3 endpoint URL (Railway bucket / MinIO / R2). Omit for AWS S3."
required = false
sensitive = false

[[env]]
key = "S3_REGION"
description = "S3 region (default: us-east-1; many S3-compatible providers ignore it)"
required = false
sensitive = false

[[env]]
key = "S3_PREFIX"
description = "Key prefix applied to every object (default: bucket root)"
required = false
sensitive = false

[[env]]
key = "S3_FORCE_PATH_STYLE"
description = "Path-style addressing endpoint/bucket/key (default: true). Set to false only for providers that require virtual-hosted-style."
required = false
sensitive = false
